<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f4ed">
    <meta name="description" content="Our wedding program. Thank you for celebrating with us.">
    <title>Our Wedding · The Program</title>
    <link rel="stylesheet" href="styles.css">
    <script src="program.js" defer></script>
  </head>
  <body>
    <main>
      <header class="welcome">
        <p class="eyebrow">Together with our favorite people</p>
        <div class="sprig" aria-hidden="true">❧</div>
        <h1 id="couple">Our wedding</h1>
        <p class="occasion" id="occasion" hidden></p>
        <div class="intro" id="welcome"><p>Thank you for celebrating with us.</p></div>
      </header>

      <section class="program" aria-labelledby="program-heading">
        <div class="section-heading"><span aria-hidden="true"></span><h2 id="program-heading">The program</h2><span aria-hidden="true"></span></div>
        <p id="draft-message" class="draft">Our program is taking shape. Please check back for the details of our day.</p>
        <nav class="program-nav" aria-label="Program sections" hidden>
          <label for="section-picker">Follow along</label>
          <select id="section-picker"><option value="">Jump to a ceremony section</option></select>
          <button id="toggle-sections" type="button">Expand all sections</button>
        </nav>
        <ol id="events" class="events"></ol>
      </section>

      <section id="people-section" class="people" aria-labelledby="people-heading" hidden>
        <h2 id="people-heading">By our side</h2>
        <dl id="people"></dl>
      </section>
      <footer><div class="sprig" aria-hidden="true">❧</div><p id="thanks">It means the world to have you here.</p><p class="eyebrow">With love &amp; gratitude</p></footer>
    </main>
    <noscript><p class="fallback">Please enable JavaScript to view the latest program.</p></noscript>
  </body>
</html>
